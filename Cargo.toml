[package]
name = "axum_template"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-sqlite", "rbac"] }
sea-orm-migration = { version = "2.0.2", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
inventory = "0.3"
anyhow = "1.0.104"
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.19.3"
lettre = { version = "0.11.23", features = ["tokio1", "smtp-transport", "builder", "tokio1-native-tls"] }
configparser = "3.2.0"
uuid = { version = "1.26", features = ["v4"] }
tower-http = { version = "0.7.1", features = ["trace"] }
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
